name: 构建 APK

# 三种触发方式：push 到主分支 / 手动点 Run workflow / 改代码后自动跑
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK Platform 34 与 Build-Tools 34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: 准备 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HotRank-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 挂到 Release 之后，手机上打开这个固定链接就能直接下载，不用登录：
      # https://github.com/<你的用户名>/<仓库名>/releases/download/latest-build/app-debug.apk
      - name: 挂到 Release 方便手机直接下载
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: 最新构建
          body: 自动构建的 Debug APK。安装前需在系统设置里允许「安装未知来源应用」。
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
